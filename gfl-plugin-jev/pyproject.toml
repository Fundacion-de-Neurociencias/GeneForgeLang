[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfl-plugin-jev"
version = "0.1.0"
description = "GFL decoupled plugin for TypeSafe discrete decision models, permutation-invariant logit scoring, and calibrated pre-screening"
readme = "README.md"
authors = [{ name = "Fundacion de Neurociencias", email = "info@neurociencias.org" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.entry-points."geneforgelang.plugins"]
jev = "gfl_plugin_jev.plugin:JevDecisionPlugin"
