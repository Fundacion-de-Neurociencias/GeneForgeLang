name: Code Quality

on:
  pull_request:
    branches: [ main ]

# Linting runs in the CI Pipeline workflow (Ruff, configured by ruff.toml).
# This workflow holds the architectural guards that Ruff cannot express.

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Guard: src/ must not introduce new hard references to the "GeneForge"
      # runtime (without "Lang"). Each allowed line is listed below with the
      # reason it may name GeneForge. Any new occurrence fails the build.
      - name: Check GFL independence from GeneForge runtime
        run: |
          set -euo pipefail
          test -d src/geneforgelang

          HITS=$(grep -rn "GeneForge[^L]" src/geneforgelang/ \
            | grep -v "GeneForgeSkill = GFLBioSkill" \
            | grep -v "export_to_geneforge_adapter" \
            | grep -v "deprecated" \
            | grep -v "Deprecated" \
            | grep -v "GFL downstream runtime (GeneForge" \
            | grep -v "GeneForge, or any third-party" \
            | grep -v "Clients (GeneForge, PharmaOracle, third parties)" \
            | grep -v '"GeneForge-Rosalind"' \
            | grep -v "GeneForge OnTrack execution (ADR-ARCH-001)" \
            | grep -v '"GeneForge_OnTrack (ADR-ARCH-001)"' \
            | grep -v "GeneForge Multi-Dimensional Dynamic DNA Helix Explorer" \
            | grep -v "<title>GeneForge DNA Viewer" \
            || true)

          if [ -n "$HITS" ]; then
            echo "Unexpected GeneForge runtime references found in src/geneforgelang/:"
            echo "$HITS"
            echo ""
            echo "GFL src/ must remain independent of the GeneForge runtime."
            echo "If this is intentional, add the line to the allowlist in quality.yml."
            exit 1
          fi

          echo "No unexpected GeneForge runtime references in src/geneforgelang/"
