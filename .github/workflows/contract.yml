name: Public contract

# Guards the API that clients (GeneForge, PharmaOracle) rely on. See docs/spec/API_CONTRACT.md.
on:
  pull_request:
    branches: [ main ]
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: read

jobs:
  contract:
    name: Contract and release tag
    runs-on: ubuntu-24.04  # 3.9 is not published for newer images
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.12' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # --against reads the snapshot of the base branch

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot matches the code
        run: python -m geneforgelang.public_contract --check

      # A change to the surface needs a version bump and a "Contract X.Y.Z" changelog line.
      # When the base branch has no snapshot yet (the first pull request), the command prints
      # a notice and exits 0.
      - name: Bump rules against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m geneforgelang.public_contract --against "origin/${BASE_REF}"

      - name: Release tag matches the package metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python -m geneforgelang.public_contract --check-tag "${TAG}"
