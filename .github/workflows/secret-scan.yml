name: Secret scan

# Blocks leaked credentials (F001). Required status check on main: "gitleaks".
# Supply chain: checkout is pinned by commit SHA; gitleaks is a version-pinned release binary checked
# against a literal SHA-256 (gitleaks-action needs a license key for organization repositories).
# Config trust: on pull requests the gitleaks config is read from the BASE commit, so a PR cannot
# widen its own allowlist.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.24.3 (checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks_8.24.3_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks_8.24.3_linux_x64.tar.gz" | sha256sum -c -
          mkdir -p gitleaks-bin
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan commits and tree
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks version

          config_args=()
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git show "$BASE_SHA:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks-base.toml" 2>/dev/null; then
              config_args=(--config "$RUNNER_TEMP/gitleaks-base.toml")
              echo "Using .gitleaks.toml from the base commit $BASE_SHA"
            else
              echo "The base commit has no .gitleaks.toml; using the gitleaks default rules"
            fi
            range="$BASE_SHA..$HEAD_SHA"
          else
            if [ -f .gitleaks.toml ]; then
              config_args=(--config .gitleaks.toml)
            fi
            # A new branch (all-zero "before") or a force-push (unreachable "before") has no usable range.
            if [ -n "${BEFORE_SHA//0/}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              range="$BEFORE_SHA..$AFTER_SHA"
            fi
          fi

          status=0
          if [ -n "$range" ]; then
            echo "Scanning commits $range"
            gitleaks git --no-banner --redact --verbose "${config_args[@]}" --log-opts="$range" . || status=1
          else
            echo "No commit range to scan; scanning the tree only"
          fi
          echo "Scanning the checked-out tree"
          gitleaks dir --no-banner --redact --verbose "${config_args[@]}" . || status=1
          exit "$status"
