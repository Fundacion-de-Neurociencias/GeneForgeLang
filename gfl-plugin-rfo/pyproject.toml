[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfl-plugin-rfo"
version = "0.1.0"
description = "GFL decoupled plugin for RFOptimization, borderline candidate rescue, and multi-model consensus validation"
readme = "README.md"
authors = [{ name = "Fundacion de Neurociencias", email = "info@neurociencias.org" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.entry-points."geneforgelang.plugins"]
rfo = "gfl_plugin_rfo.plugin:RFOptimizationPlugin"
