[build-system]
requires = [setuptools>=61.0]
build-backend = setuptools.build_meta

[project]
name = gfl-plugin-alphagenome
version = 0.1.0
description = GFL plugin for Google DeepMind AlphaGenome Atlas, AVI scores, and regulatory motif prioritization
readme = README.md
authors = [{ name = GeneForgeLang & Fundacion de Neurociencias, email = info@neurociencias.org }]
license = { text = MIT }
classifiers = [
    Programming Language :: Python :: 3,
    Topic :: Scientific/Engineering :: Bio-Informatics,
]
dependencies = []

[project.entry-points.geneforgelang.plugins]
alphagenome = gfl_plugin_alphagenome.plugin:AlphaGenomePlugin
