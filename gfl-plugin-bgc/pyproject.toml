[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfl-plugin-bgc"
version = "0.1.0"
description = "GFL decoupled plugin for Biosynthetic Gene Cluster (BGC) and multi-domain Megasynthase assembly line engineering"
readme = "README.md"
authors = [{ name = "Fundacion de Neurociencias", email = "info@neurociencias.org" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.entry-points."geneforgelang.plugins"]
bgc = "gfl_plugin_bgc.plugin:BGCPlugin"
